<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>긍랑 팔로우 100 달성 축하</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎉</text></svg>">
<style>
  :root{
    --bg-1:#00ffa3;
    --bg-2:#80e7fc;
    --gold:#ffd166;
    --gold-2:#ffb703;
    --pink:#ff5da2;
    --card-bg:rgba(6,24,22,0.42);
    --card-border:rgba(255,255,255,0.35);
    --text:#fff8ec;
    --text-dim:#d9c9ff;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    height:100%;
    overflow-x:hidden;
  }

  body{
    min-height:100vh;
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 18% 18%, rgba(255,255,255,0.35), transparent 40%),
      radial-gradient(circle at 85% 20%, rgba(255,255,255,0.22), transparent 40%),
      radial-gradient(circle at 50% 95%, rgba(0,180,255,0.25), transparent 55%),
      linear-gradient(135deg, var(--bg-1), var(--bg-2));
    background-attachment:fixed;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
  }

  /* ambient floating sparkles */
  .sparkle-field{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
  }
  .sparkle{
    position:absolute;
    bottom:-10%;
    font-size:1.4rem;
    opacity:0;
    animation:drift linear infinite;
    filter:drop-shadow(0 0 6px rgba(255,209,102,0.5));
  }
  @keyframes drift{
    0%{ transform:translateY(0) translateX(0) rotate(0deg); opacity:0; }
    10%{ opacity:0.9; }
    90%{ opacity:0.7; }
    100%{ transform:translateY(-115vh) translateX(var(--drift-x,20px)) rotate(360deg); opacity:0; }
  }

  .card{
    position:relative;
    z-index:2;
    width:min(560px, 92vw);
    padding:44px 36px 40px;
    border-radius:28px;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    backdrop-filter:blur(18px);
    box-shadow:0 30px 80px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
    text-align:center;
    margin:32px 0;
  }

  .crown{
    font-size:2.4rem;
    display:inline-block;
    animation:bob 2.4s ease-in-out infinite;
    filter:drop-shadow(0 0 12px rgba(255,209,102,0.6));
  }
  @keyframes bob{
    0%,100%{ transform:translateY(0) rotate(-4deg); }
    50%{ transform:translateY(-8px) rotate(4deg); }
  }

  .avatar{
    width:120px;
    height:120px;
    margin:10px auto 18px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:3rem;
    font-weight:800;
    color:#3a1466;
    background:linear-gradient(135deg, var(--gold), var(--pink));
    box-shadow:0 0 0 5px rgba(255,255,255,0.12), 0 0 40px rgba(255,157,201,0.55);
    position:relative;
    user-select:none;
  }
  .avatar::after{
    content:"";
    position:absolute;
    inset:-10px;
    border-radius:50%;
    border:2px dashed rgba(255,209,102,0.55);
    animation:spin 12s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* To use a real photo instead of the initial-letter avatar:
     replace the .avatar <div> below with:
     <img class="avatar" src="streamer-photo.jpg" alt="긍랑" style="object-fit:cover;"> */

  .streamer-name{
    font-size:1.05rem;
    letter-spacing:0.04em;
    color:var(--text-dim);
    margin:0 0 6px;
  }

  h1{
    margin:0 0 22px;
    font-size:1.5rem;
    line-height:1.4;
    font-weight:800;
  }
  h1 .highlight{
    background:linear-gradient(90deg, var(--gold), var(--pink));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .counter-wrap{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:10px;
    margin:8px 0 6px;
  }
  .counter{
    font-size:clamp(3.2rem, 12vw, 4.6rem);
    font-weight:900;
    background:linear-gradient(90deg, var(--gold-2), var(--gold), var(--pink));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 60px rgba(255,209,102,0.25);
    font-variant-numeric:tabular-nums;
  }
  .counter-label{
    font-size:1.2rem;
    font-weight:700;
    color:var(--text-dim);
  }

  .subtitle{
    color:var(--text-dim);
    margin:0 0 32px;
    font-size:0.98rem;
  }

  .buttons{
    display:flex;
    gap:14px;
    justify-content:center;
    flex-wrap:wrap;
  }

  button{
    font-family:inherit;
    font-size:1.02rem;
    font-weight:800;
    padding:15px 26px;
    border-radius:999px;
    border:none;
    cursor:pointer;
    color:#2c1150;
    transition:transform .18s ease, box-shadow .18s ease, opacity .3s ease;
  }
  button:active{ transform:translateY(1px) scale(0.98); }

  #celebrateBtn{
    background:linear-gradient(90deg, var(--gold), var(--pink));
    box-shadow:0 10px 30px rgba(255,141,187,0.45);
  }
  #celebrateBtn:hover{ transform:translateY(-2px); box-shadow:0 14px 34px rgba(255,141,187,0.6); }

  #nextBtn{
    background:linear-gradient(90deg,#8fe3ff,#a78bfa);
    color:#1b0f3a;
    box-shadow:0 10px 30px rgba(140,120,255,0.4);
    opacity:0;
    transform:scale(0.7) translateY(6px);
    pointer-events:none;
  }
  #nextBtn.show{
    opacity:1;
    transform:scale(1) translateY(0);
    pointer-events:auto;
  }
  #nextBtn:hover{ transform:translateY(-2px); }
  #nextBtn:disabled{
    opacity:0.55;
    cursor:default;
    transform:none !important;
    box-shadow:none;
  }

  /* progress section */
  .progress-section{
    margin-top:30px;
    max-height:0;
    opacity:0;
    overflow:hidden;
    transition:max-height .5s ease, opacity .5s ease, margin-top .5s ease;
  }
  .progress-section.show{
    max-height:200px;
    opacity:1;
  }

  .progress-title{
    font-size:0.95rem;
    color:var(--text-dim);
    margin-bottom:14px;
    font-weight:700;
  }

  .progress-wrap{
    position:relative;
    width:100%;
    max-width:480px;
    margin:0 auto;
    padding-bottom:8px;
  }

  .progress-track-bg{
    width:100%;
    height:38px;
    border-radius:999px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.16);
    position:relative;
    overflow:hidden;
  }

  .progress-fill{
    position:absolute;
    top:0; left:0;
    height:100%;
    width:100%; /* 100/100 at start */
    border-radius:999px;
    background:linear-gradient(90deg, var(--gold-2), var(--pink));
    display:flex;
    align-items:center;
    justify-content:flex-end;
    padding-right:14px;
    box-shadow:0 0 18px rgba(255,157,201,0.6);
    transition:width 1.1s cubic-bezier(.34,1.56,.64,1);
  }
  .progress-fill span{
    font-weight:800;
    font-size:0.92rem;
    color:#2c1150;
    white-space:nowrap;
  }

  .goal-marker{
    position:absolute;
    top:50%;
    right:6px;
    transform:translateY(-50%) scale(0);
    background:linear-gradient(90deg,#8fe3ff,#a78bfa);
    color:#1b0f3a;
    font-weight:800;
    font-size:0.78rem;
    padding:5px 10px;
    border-radius:999px;
    white-space:nowrap;
    box-shadow:0 6px 16px rgba(140,120,255,0.5);
    transition:transform .4s cubic-bezier(.34,1.56,.64,1) 0.9s;
  }
  .goal-marker.show{
    transform:translateY(-50%) scale(1);
  }

  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    15%{ transform:translateX(-10px) rotate(-1deg); }
    30%{ transform:translateX(9px) rotate(1deg); }
    45%{ transform:translateX(-7px) rotate(-1deg); }
    60%{ transform:translateX(6px) rotate(1deg); }
    75%{ transform:translateX(-4px); }
    90%{ transform:translateX(3px); }
  }
  .progress-wrap.shake{
    animation:shake 0.6s ease;
  }

  /* toast */
  .toast{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) scale(0.6);
    font-size:clamp(1.6rem,6vw,2.4rem);
    font-weight:900;
    color:var(--gold);
    text-shadow:0 4px 30px rgba(0,0,0,0.5), 0 0 40px rgba(255,209,102,0.7);
    opacity:0;
    pointer-events:none;
    z-index:20;
    transition:transform .5s cubic-bezier(.34,1.56,.64,1), opacity .5s ease;
    white-space:nowrap;
    text-align:center;
  }
  .toast.show{
    transform:translate(-50%,-50%) scale(1);
    opacity:1;
  }

  canvas#confetti-canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:15;
  }

  footer{
    position:relative;
    z-index:2;
    text-align:center;
    color:rgba(6,40,35,0.55);
    font-size:0.8rem;
    margin-top:-10px;
    margin-bottom:24px;
  }
</style>
</head>
<body>

  <div class="sparkle-field" id="sparkleField"></div>
  <canvas id="confetti-canvas"></canvas>
  <div class="toast" id="toast">🎉 축하합니다! 🎉</div>

  <main class="card">
    <div class="crown">👑</div>

    <div class="avatar" aria-hidden="true">긍</div>
    <!-- 실제 사진으로 교체하려면 위 div를
         <img class="avatar" src="streamer-photo.jpg" alt="긍랑" style="object-fit:cover;">
         로 바꿔주세요 -->

    <p class="streamer-name">STREAMER · 긍랑</p>
    <h1>팔로우 <span class="highlight">100</span> 달성 기념 🎊</h1>

    <div class="counter-wrap">
      <span class="counter" id="counter">0</span>
      <span class="counter-label">팔로우</span>
    </div>
    <p class="subtitle">긍랑님과 함께한 모든 순간, 진심으로 축하드려요!</p>

    <div class="buttons">
      <button id="celebrateBtn">🎊 축하하기</button>
      <button id="nextBtn">다음은..? →</button>
    </div>

    <div class="progress-section" id="progressSection">
      <p class="progress-title">다음 목표를 향해!</p>
      <div class="progress-wrap" id="progressWrap">
        <div class="progress-track-bg">
          <div class="progress-fill" id="progressFill">
            <span>100</span>
          </div>
          <div class="goal-marker" id="goalMarker">🎯 다음 목표 150</div>
        </div>
      </div>
    </div>
  </main>

  <footer>Made with 💛 for 긍랑</footer>

<script>
(function(){
  "use strict";

  /* ---------- ambient sparkles ---------- */
  var sparkleField = document.getElementById('sparkleField');
  var sparkleEmojis = ['✨','🎈','⭐','💫'];
  var sparkleCount = 22;
  for (var i = 0; i < sparkleCount; i++){
    var el = document.createElement('span');
    el.className = 'sparkle';
    el.textContent = sparkleEmojis[Math.floor(Math.random()*sparkleEmojis.length)];
    var left = Math.random()*100;
    var duration = 9 + Math.random()*10;
    var delay = Math.random()*14;
    var driftX = (Math.random()*160 - 80) + 'px';
    el.style.left = left + 'vw';
    el.style.setProperty('--drift-x', driftX);
    el.style.animationDuration = duration + 's';
    el.style.animationDelay = delay + 's';
    el.style.fontSize = (1 + Math.random()*1.2) + 'rem';
    sparkleField.appendChild(el);
  }

  /* ---------- counter animation ---------- */
  var counterEl = document.getElementById('counter');
  var target = 100;
  var duration = 1600;
  var startTime = null;

  function easeOutExpo(t){
    return t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
  }

  function stepCount(ts){
    if (startTime === null) startTime = ts;
    var progress = Math.min((ts - startTime) / duration, 1);
    var eased = easeOutExpo(progress);
    counterEl.textContent = Math.round(eased * target);
    if (progress < 1){
      requestAnimationFrame(stepCount);
    } else {
      counterEl.textContent = target;
    }
  }
  requestAnimationFrame(stepCount);

  /* ---------- confetti ---------- */
  var canvas = document.getElementById('confetti-canvas');
  var ctx = canvas.getContext('2d');
  var particles = [];
  var confettiColors = ['#ffd166','#ff5da2','#8fe3ff','#a78bfa','#ffb703','#ffffff'];
  var animRunning = false;

  function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  function spawnConfetti(originX, originY, count){
    for (var i = 0; i < count; i++){
      var angle = Math.random() * Math.PI * 2;
      var speed = 4 + Math.random() * 9;
      particles.push({
        x: originX,
        y: originY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 4,
        size: 6 + Math.random() * 7,
        color: confettiColors[Math.floor(Math.random()*confettiColors.length)],
        rotation: Math.random() * Math.PI,
        rotationSpeed: (Math.random() - 0.5) * 0.3,
        gravity: 0.18 + Math.random() * 0.08,
        drag: 0.985,
        life: 0,
        maxLife: 110 + Math.random() * 50
      });
    }
    if (!animRunning){
      animRunning = true;
      requestAnimationFrame(animateConfetti);
    }
  }

  function animateConfetti(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (var i = particles.length - 1; i >= 0; i--){
      var p = particles[i];
      p.vx *= p.drag;
      p.vy = p.vy * p.drag + p.gravity;
      p.x += p.vx;
      p.y += p.vy;
      p.rotation += p.rotationSpeed;
      p.life++;

      var lifeRatio = p.life / p.maxLife;
      var alpha = lifeRatio > 0.8 ? Math.max(0, 1 - (lifeRatio - 0.8) / 0.2) : 1;

      if (p.life >= p.maxLife || p.y > canvas.height + 40){
        particles.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/4, p.size, p.size/2);
      ctx.restore();
    }

    if (particles.length > 0){
      requestAnimationFrame(animateConfetti);
    } else {
      animRunning = false;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }

  /* ---------- toast ---------- */
  var toast = document.getElementById('toast');
  var toastTimer = null;
  function showToast(){
    clearTimeout(toastTimer);
    toast.classList.add('show');
    toastTimer = setTimeout(function(){
      toast.classList.remove('show');
    }, 1600);
  }

  /* ---------- celebrate button ---------- */
  var celebrateBtn = document.getElementById('celebrateBtn');
  var nextBtn = document.getElementById('nextBtn');
  var hasCelebrated = false;

  celebrateBtn.addEventListener('click', function(){
    var rect = celebrateBtn.getBoundingClientRect();
    var originX = rect.left + rect.width / 2;
    var originY = rect.top + rect.height / 2;

    spawnConfetti(originX, originY, 140);
    spawnConfetti(window.innerWidth * 0.15, window.innerHeight * 0.2, 60);
    spawnConfetti(window.innerWidth * 0.85, window.innerHeight * 0.2, 60);
    showToast();

    if (!hasCelebrated){
      hasCelebrated = true;
      nextBtn.classList.add('show');
    }
  });

  /* ---------- next button / progress bar ---------- */
  var progressSection = document.getElementById('progressSection');
  var progressWrap = document.getElementById('progressWrap');
  var progressFill = document.getElementById('progressFill');
  var goalMarker = document.getElementById('goalMarker');
  var nextTriggered = false;

  nextBtn.addEventListener('click', function(){
    if (nextTriggered) return;
    nextTriggered = true;
    nextBtn.disabled = true;
    nextBtn.textContent = '다음 목표 공개! 🎯';

    progressSection.classList.add('show');

    // let the section expand first, then shake + reveal the next goal
    setTimeout(function(){
      progressWrap.classList.add('shake');

      setTimeout(function(){
        progressWrap.classList.remove('shake');
        // bar now represents scale up to 150; fill stays pinned at "100"
        progressFill.style.width = (100 / 150 * 100) + '%';
        goalMarker.classList.add('show');

        spawnConfetti(window.innerWidth / 2, window.innerHeight * 0.55, 50);
      }, 620);
    }, 500);
  });

})();
</script>
</body>
</html>
