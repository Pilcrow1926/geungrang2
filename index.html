<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>긍랑 팔로우 100 달성 축하</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎉</text></svg>">
<style>
  /* 카페24 아네모네체 (제목용) / Pretendard SemiBold (숫자·본문용)
     아래 두 woff 파일을 assets/fonts/ 안에 넣어주세요:
     - assets/fonts/Cafe24Anemone.woff
     - assets/fonts/Pretendard-SemiBold.woff */
  @font-face{
    font-family:'Cafe24Anemone';
    src:url('assets/fonts/Cafe24Anemone.woff') format('woff');
    font-weight:normal;
    font-style:normal;
    font-display:swap;
  }
  @font-face{
    font-family:'Pretendard';
    src:url('assets/fonts/Pretendard-SemiBold.woff') format('woff');
    font-weight:600;
    font-style:normal;
    font-display:swap;
  }

  :root{
    --bg-1:#00ffa3;
    --bg-2:#80e7fc;
    --bg-3:#a9c5ff;
    --green:#00e08a;
    --white:#ffffff;
    --font-title:'Cafe24Anemone','Cafe24Ohsquare',cursive,sans-serif;
    --font-body:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',-apple-system,BlinkMacSystemFont,sans-serif;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    height:100%;
    overflow-x:hidden;
  }

  body{
    min-height:100vh;
    font-family:var(--font-body);
    font-weight:600;
    color:#ffffff;
    background:linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 72%, var(--bg-3) 100%);
    background-attachment:fixed;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:32px 20px;
  }

  main{
    position:relative;
    z-index:2;
    width:min(520px, 90vw);
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ---------- avatar ---------- */
  .avatar-wrap{
    position:relative;
    width:180px;
    height:180px;
    margin-bottom:22px;
  }
  .avatar{
    width:100%;
    height:100%;
    border-radius:50%;
    border:5px solid #ffffff;
    box-shadow:0 12px 30px rgba(0,40,30,0.18);
    background:linear-gradient(135deg,#dff6ff,#bfe9ff);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .avatar span{
    font-family:var(--font-title);
    font-size:4rem;
    color:#1b6fa8;
  }
  .avatar-photo{
    display:none;
    width:100%;
    height:100%;
    object-fit:cover;
  }
  /* assets/geungrang2.png 파일이 있으면 자동으로 사진이 뜨고,
     없으면 위 "긍" 글자가 대신 보여요 */
  .name{
    font-family:var(--font-title);
    font-weight:400;
    font-size:2.4rem;
    color:#ffffff;
    text-shadow:0 4px 14px rgba(0,40,30,0.18);
    margin:0 0 40px;
  }

  /* ---------- progress bar ---------- */
  .bar-wrap{
    width:100%;
    margin-bottom:12px;
  }
  .bar-track{
    position:relative;
    width:100%;
    height:26px;
    border-radius:999px;
    border:2px solid #ffffff;
    background:rgba(255,255,255,0.14);
    overflow:hidden;
  }
  .bar-fill{
    position:absolute;
    top:0; left:0;
    height:100%;
    width:0%;
    border-radius:999px;
    background:#ffffff;
    transition:width 1.4s cubic-bezier(.22,1,.36,1);
  }
  .bar-labels{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
    padding:0 6px;
    font-size:1.1rem;
    font-weight:600;
    font-variant-numeric:tabular-nums;
  }
  .bar-labels .goal-value{
    display:inline-block;
    transition:transform .3s ease;
  }
  .bar-labels .goal-value.bump{
    transform:scale(1.3);
  }

  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    15%{ transform:translateX(-10px) rotate(-1deg); }
    30%{ transform:translateX(9px) rotate(1deg); }
    45%{ transform:translateX(-7px) rotate(-1deg); }
    60%{ transform:translateX(6px) rotate(1deg); }
    75%{ transform:translateX(-4px); }
    90%{ transform:translateX(3px); }
  }
  .bar-wrap.shake{
    animation:shake 0.6s ease;
  }

  /* ---------- buttons ---------- */
  .actions{
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top:28px;
  }
  button{
    font-family:var(--font-body);
    font-weight:600;
    border:none;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, opacity .3s ease;
  }
  button:active{ transform:translateY(1px) scale(0.97); }

  #celebrateBtn{
    width:68px;
    height:52px;
    border-radius:26px;
    font-size:1.6rem;
    background:var(--green);
    box-shadow:0 10px 24px rgba(0,60,40,0.28);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #celebrateBtn:hover{ transform:translateY(-2px); box-shadow:0 14px 28px rgba(0,60,40,0.35); }

  #nextBtn{
    height:52px;
    max-width:0;
    padding:0;
    margin-left:0;
    border-radius:26px;
    font-size:1rem;
    background:#ffffff;
    color:#049966;
    box-shadow:0 10px 24px rgba(0,60,40,0.2);
    opacity:0;
    overflow:hidden;
    white-space:nowrap;
    pointer-events:none;
    transition:
      max-width .55s cubic-bezier(.34,1.56,.64,1),
      margin-left .55s cubic-bezier(.34,1.56,.64,1),
      padding .55s cubic-bezier(.34,1.56,.64,1),
      opacity .4s ease .1s,
      transform .15s ease;
  }
  #nextBtn.show{
    max-width:260px;
    padding:0 22px;
    margin-left:14px;
    opacity:1;
    pointer-events:auto;
  }
  #nextBtn:hover{ transform:translateY(-2px); }
  #nextBtn:disabled{
    opacity:0.6;
    cursor:default;
    transform:none !important;
    box-shadow:none;
  }

  /* ---------- toast ---------- */
  .toast-slot{
    height:34px;
    margin-top:14px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .toast{
    transform:translateY(6px) scale(0.85);
    font-family:var(--font-title);
    font-size:1.4rem;
    color:#ffffff;
    text-shadow:0 4px 20px rgba(0,40,30,0.3), 0 0 24px rgba(255,255,255,0.4);
    opacity:0;
    pointer-events:none;
    transition:transform .45s cubic-bezier(.34,1.56,.64,1), opacity .4s ease;
    white-space:nowrap;
    text-align:center;
  }
  .toast.show{
    transform:translateY(0) scale(1);
    opacity:1;
  }

  /* ---------- timeline ---------- */
  .timeline-section{
    width:min(480px, 88vw);
    max-height:0;
    opacity:0;
    overflow:hidden;
    margin-top:0;
    transition:max-height .8s ease, opacity .6s ease .1s, margin-top .8s ease;
  }
  .timeline-section.show{
    max-height:600px;
    opacity:1;
    margin-top:50px;
  }
  .timeline-title{
    font-size:0.85rem;
    letter-spacing:0.16em;
    opacity:0.8;
    margin:0 0 20px;
    text-align:center;
  }
  .timeline-list{
    position:relative;
    text-align:left;
    padding-left:24px;
    padding-bottom:40px;
  }
  .timeline-list::before{
    content:"";
    position:absolute;
    left:5px;
    top:6px;
    bottom:10px;
    width:2px;
    background:rgba(255,255,255,0.45);
  }
  .timeline-item{
    position:relative;
    padding-bottom:26px;
  }
  .timeline-item:last-child{
    padding-bottom:0;
  }
  .timeline-item::before{
    content:"";
    position:absolute;
    left:-24px;
    top:4px;
    width:12px;
    height:12px;
    border-radius:50%;
    background:#ffffff;
    box-shadow:0 0 0 4px rgba(255,255,255,0.25);
  }
  .timeline-date{
    font-size:0.85rem;
    opacity:0.85;
    margin-bottom:4px;
  }
  .timeline-desc{
    font-size:1.05rem;
  }

  canvas#confetti-canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:15;
  }
</style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <main>
    <div class="avatar-wrap">
      <div class="avatar">
        <span id="avatarFallback">긍</span>
        <img id="avatarPhoto" class="avatar-photo" src="assets/geungrang2.png" alt="긍랑"
             onload="document.getElementById('avatarFallback').style.display='none'; this.style.display='block';"
             onerror="this.style.display='none';">
      </div>
    </div>

    <h1 class="name">긍랑</h1>

    <div class="bar-wrap" id="barWrap">
      <div class="bar-track">
        <div class="bar-fill" id="barFill"></div>
      </div>
      <div class="bar-labels">
        <span>0</span>
        <span class="goal-value" id="goalValue">100</span>
      </div>
    </div>

    <div class="toast-slot">
      <div class="toast" id="toast">🎉 축하합니다! 🎉</div>
    </div>

    <div class="actions">
      <button id="celebrateBtn" aria-label="축하하기">🎉</button>
      <button id="nextBtn">다음은..? →</button>
    </div>

    <section class="timeline-section" id="timelineSection">
      <p class="timeline-title">TIMELINE</p>
      <div class="timeline-list">
        <div class="timeline-item">
          <div class="timeline-date">2026.06.23</div>
          <div class="timeline-desc">///</div>
        </div>
        <div class="timeline-item">
          <div class="timeline-date">2026.08.06</div>
          <div class="timeline-desc">50팔 달성!</div>
        </div>
        <div class="timeline-item">
          <div class="timeline-date">2026.08.27</div>
          <div class="timeline-desc">100팔 달성!</div>
        </div>
      </div>
    </section>
  </main>

<script>
(function(){
  "use strict";

  /* ---------- bar fill count-up on load ---------- */
  var barFill = document.getElementById('barFill');
  var goalValue = document.getElementById('goalValue');
  var current = 100;
  var target = 100;

  function updateBarFill(){
    barFill.style.width = Math.min(current / target * 100, 100) + '%';
  }

  requestAnimationFrame(function(){
    requestAnimationFrame(updateBarFill);
  });

  /* ---------- confetti ---------- */
  var canvas = document.getElementById('confetti-canvas');
  var ctx = canvas.getContext('2d');
  var particles = [];
  var confettiColors = ['#00ffa3','#80e7fc','#a9c5ff','#ffffff','#ffd166','#ff5da2'];
  var animRunning = false;

  function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  function spawnConfetti(originX, originY, count){
    for (var i = 0; i < count; i++){
      var angle = Math.random() * Math.PI * 2;
      var speed = 4 + Math.random() * 9;
      particles.push({
        x: originX,
        y: originY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 4,
        size: 6 + Math.random() * 7,
        color: confettiColors[Math.floor(Math.random()*confettiColors.length)],
        rotation: Math.random() * Math.PI,
        rotationSpeed: (Math.random() - 0.5) * 0.3,
        gravity: 0.18 + Math.random() * 0.08,
        drag: 0.985,
        life: 0,
        maxLife: 110 + Math.random() * 50
      });
    }
    if (!animRunning){
      animRunning = true;
      requestAnimationFrame(animateConfetti);
    }
  }

  function animateConfetti(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (var i = particles.length - 1; i >= 0; i--){
      var p = particles[i];
      p.vx *= p.drag;
      p.vy = p.vy * p.drag + p.gravity;
      p.x += p.vx;
      p.y += p.vy;
      p.rotation += p.rotationSpeed;
      p.life++;

      var lifeRatio = p.life / p.maxLife;
      var alpha = lifeRatio > 0.8 ? Math.max(0, 1 - (lifeRatio - 0.8) / 0.2) : 1;

      if (p.life >= p.maxLife || p.y > canvas.height + 40){
        particles.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/4, p.size, p.size/2);
      ctx.restore();
    }

    if (particles.length > 0){
      requestAnimationFrame(animateConfetti);
    } else {
      animRunning = false;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }

  /* ---------- toast ---------- */
  var toast = document.getElementById('toast');
  var toastTimer = null;
  function showToast(){
    clearTimeout(toastTimer);
    toast.classList.add('show');
    toastTimer = setTimeout(function(){
      toast.classList.remove('show');
    }, 1600);
  }

  /* ---------- celebrate button ---------- */
  var celebrateBtn = document.getElementById('celebrateBtn');
  var nextBtn = document.getElementById('nextBtn');
  var timelineSection = document.getElementById('timelineSection');
  var hasCelebrated = false;

  celebrateBtn.addEventListener('click', function(){
    var rect = celebrateBtn.getBoundingClientRect();
    var originX = rect.left + rect.width / 2;
    var originY = rect.top + rect.height / 2;

    spawnConfetti(originX, originY, 140);
    spawnConfetti(window.innerWidth * 0.15, window.innerHeight * 0.2, 60);
    spawnConfetti(window.innerWidth * 0.85, window.innerHeight * 0.2, 60);
    showToast();

    if (!hasCelebrated){
      hasCelebrated = true;
      nextBtn.classList.add('show');
      timelineSection.classList.add('show');
    }
  });

  /* ---------- next button / progress bar growth ---------- */
  var barWrap = document.getElementById('barWrap');
  var nextTriggered = false;

  function tweenGoalLabel(from, to, ms){
    var start = null;
    goalValue.classList.add('bump');
    function step(ts){
      if (start === null) start = ts;
      var p = Math.min((ts - start) / ms, 1);
      goalValue.textContent = Math.round(from + (to - from) * p);
      if (p < 1){
        requestAnimationFrame(step);
      } else {
        goalValue.textContent = to;
        setTimeout(function(){ goalValue.classList.remove('bump'); }, 200);
      }
    }
    requestAnimationFrame(step);
  }

  nextBtn.addEventListener('click', function(){
    if (nextTriggered) return;
    nextTriggered = true;
    nextBtn.disabled = true;
    nextBtn.textContent = '다음 목표 공개! 🎯';

    barWrap.classList.add('shake');

    setTimeout(function(){
      barWrap.classList.remove('shake');
      // scale now goes up to 150; current stays pinned at 100
      target = 150;
      tweenGoalLabel(100, 150, 700);
      updateBarFill();

      spawnConfetti(window.innerWidth / 2, window.innerHeight * 0.55, 50);
    }, 600);
  });

})();
</script>
</body>
</html>
